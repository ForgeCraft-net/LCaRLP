name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]

env:
  JAVA_VERSION: '21'
  DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '--batch-mode --no-transfer-progress'

jobs:
  # Этап тестирования
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: 'maven'

      - name: Run unit tests
        run: mvn ${{ env.MAVEN_OPTS }} test

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Test Report
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  # Этап сборки с оптимизацией
  build:
    name: Build with Optimization
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: 'maven'

      - name: Build with optimization
        run: mvn ${{ env.MAVEN_OPTS }} -P prod clean package

      - name: Analyze JAR size
        run: |
          echo "JAR size analysis:"
          ls -lh target/*.jar
          du -sh target/*.jar | awk '{print "Size: " $1}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimized-jar
          path: target/*.jar

  # Этап создания релиза
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: optimized-jar
          path: target

      - name: Get version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Генерация changelog из коммитов
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            ## Что нового в этой версии
            
            ${{ steps.changelog.outputs.changes }}
            
            ## Скачать
            * [LCaRLP-${{ steps.get_version.outputs.version }}-shaded.jar](target/LCaRLP-${{ steps.get_version.outputs.version }}-shaded.jar)
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}